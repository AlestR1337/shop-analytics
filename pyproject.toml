[project]
name = "weather-generator"
version = "0.1.0"
description = "Генератор потока данных погодной станции — первый модуль учебного E2E-проекта"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "clickhouse-connect>=0.8.0",
    "pydantic-settings>=2.6.0",
]

[project.scripts]
weather-generator = "generator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/generator"]

[tool.uv]
native-tls = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM", "RUF"]
# Докстринги проекта на русском — правила о «неоднозначных» unicode-символах
# (RUF001/RUF002/RUF003) дают ложные срабатывания на кириллице.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = ["tests/"]